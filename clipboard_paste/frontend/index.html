<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #zone {
      min-height: 96px;
      padding: 16px;
      border: 2px dashed #9aa0a6;
      border-radius: 10px;
      background: #f8f9fa;
      color: #5f6368;
      text-align: center;
      line-height: 1.5;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    #zone:focus,
    #zone.active,
    #zone.dragover {
      border-color: #4285f4;
      background: #eef4ff;
      color: #1a73e8;
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      color: #188038;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div id="zone" tabindex="0"></div>
  <div id="status"></div>
  <script>
    const zone = document.getElementById("zone");
    const status = document.getElementById("status");
    const defaultLabel =
      "여기를 클릭한 뒤 Ctrl+V(⌘+V)로 붙여넣거나, 이미지 파일을 끌어다 놓으세요.";

    function sendMessageToStreamlitClient(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data),
        "*"
      );
    }

    function init() {
      sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
    }

    function setFrameHeight(height) {
      sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
    }

    function sendDataToPython(data) {
      sendMessageToStreamlitClient("streamlit:setComponentValue", data);
    }

    function setLabel(label) {
      zone.textContent = label || defaultLabel;
    }

    function readImageFile(file, successMessage) {
      if (!file || !file.type.startsWith("image/")) {
        status.textContent = "PNG, JPG, WEBP, GIF 이미지 파일만 사용할 수 있습니다.";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        sendDataToPython(reader.result);
        status.textContent = successMessage;
        setFrameHeight(130);
      };
      reader.onerror = () => {
        status.textContent = "이미지를 읽지 못했습니다.";
      };
      reader.readAsDataURL(file);
    }

    function handlePaste(event) {
      const items = event.clipboardData && event.clipboardData.items;
      if (!items) {
        status.textContent = "클립보드 접근이 지원되지 않는 환경입니다.";
        return;
      }

      for (const item of items) {
        if (!item.type.startsWith("image/")) {
          continue;
        }
        const file = item.getAsFile();
        if (!file) {
          continue;
        }
        event.preventDefault();
        readImageFile(file, "이미지가 붙여넣어졌습니다.");
        return;
      }

      status.textContent =
        "클립보드에 이미지가 없습니다. 이미지를 복사한 뒤 다시 붙여넣어 주세요.";
    }

    function handleDrop(event) {
      event.preventDefault();
      zone.classList.remove("dragover");

      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) {
        status.textContent = "놓을 이미지 파일이 없습니다.";
        return;
      }

      readImageFile(file, "이미지 파일이 추가되었습니다.");
    }

    function onDataFromPython(event) {
      if (!event.data || event.data.type !== "streamlit:render") {
        return;
      }
      setLabel(event.data.args && event.data.args.label);
      setFrameHeight(130);
    }

    zone.addEventListener("click", () => zone.focus());
    zone.addEventListener("focus", () => zone.classList.add("active"));
    zone.addEventListener("blur", () => zone.classList.remove("active"));
    zone.addEventListener("paste", handlePaste);
    zone.addEventListener("dragover", (event) => {
      event.preventDefault();
      zone.classList.add("dragover");
    });
    zone.addEventListener("dragleave", () => zone.classList.remove("dragover"));
    zone.addEventListener("drop", handleDrop);
    document.body.addEventListener("paste", handlePaste);

    window.addEventListener("message", onDataFromPython);
    init();
    setLabel(defaultLabel);
    setFrameHeight(130);
  </script>
</body>
</html>
